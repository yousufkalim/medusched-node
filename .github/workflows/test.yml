# This workflow is a Continuous Integration (CI) pipeline for testing a Node.js backend application.

name: 'CI'

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      # The first step checks out the code from the repository.
      - name: Checkout code
        uses: actions/checkout@v2

      # The second step sets up Node.js with version 16.
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 16

      # The third step installs the dependencies.
      - name: Install dependencies
        run: |
          yarn install
          cp .env.example .env || :

      # The fifth step runs the project.
      - name: Run the app
        run: |
          timeout 5s yarn run start
